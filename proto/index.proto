syntax = "proto3";
package askl.index;

option go_package = "github.com/planetA/askl-golang-indexer/pkg/indexpb;indexpb";

message Project {
  string project_name = 1;
  string root_path = 2;
  reserved 3;  // was modules - now symbols are project-level
  repeated Object objects = 4;
  repeated Symbol symbols = 5;  // All symbols including modules
}

// Module message removed - modules are now symbols with type=MODULE

message Object {
  int64 local_id = 1;           // Unique within project
  reserved 2;                   // was module_id - removed
  string module_path = 3;
  string filesystem_path = 4;   // Metadata only, never used for filesystem access
  string filetype = 5;
  bytes content = 6;            // Object content (content_hash computed server-side)
  repeated SymbolInstance symbol_instances = 7;  // Symbol instances in this object
  repeated SymbolRef refs = 8;  // References from this object
  string content_hash = 9;      // SHA256 hex; when set, content (field 6) may be empty
}

message ObjectContent {
  string content_hash = 1;      // SHA256 hex (lowercase)
  bytes content = 2;
}

message ContentBatch {
  repeated ObjectContent contents = 1;
}

message Symbol {
  int64 local_id = 1;           // Unique within project
  string name = 2;
  SymbolScope scope = 3;
  SymbolType type = 4;          // Function, File, Module, or Directory

  // FOLDING: whether this symbol is LISTED BY DEFAULT.  Nothing else -- it
  // plays no part in containment, and `unnest` or naming the symbol shows it
  // regardless.
  //
  // A symbol is folded when nobody wrote it down in normal code, i.e. in text
  // outside every `#define` body.  Normal code writes a symbol down by
  // declaring it with text of its own, by typing its whole name where a macro
  // declares it (`DEFINE_MUTEX(lock)`), or by typing its name -- or the part
  // of a pasted name a caller chooses, `send` in `CALL(send)` -- in a
  // reference.  What is left is what the preprocessor made for itself:
  // `__compiletime_assert_N`, the fields of a generated struct nobody reads,
  // a function reached only through an X-macro list.
  //
  // Per symbol, not per instance, because the question spans the project: one
  // file's reference unfolds a symbol that another file's macro generated.
  // An indexer that never sets it (the Go one) lists everything.
  bool folded = 5;
}

// A half-open [start, end) range within an object.  Used for the optional
// finer spans of an instance; absence means "the indexer does not know".
message Span {
  int32 start = 1;
  int32 end = 2;
}

message SymbolInstance {
  int64 symbol_local_id = 1;    // References Symbol.local_id
  InstanceType instance_type = 2;

  // The EXTENT: the authoritative containment span, everything this instance
  // owns.
  int32 start_offset = 3;
  int32 end_offset = 4;

  reserved 5, 6;  // were local_id / parent_local_id

  // Depth in the containment tree of this object, counting SYMBOL instances
  // only (the intervening statements libclang shows are not symbols).  A
  // direct child is at exactly parent + 1, which is what makes "direct
  // children" a filter rather than a correlated NOT EXISTS over ranges.
  //
  // Nesting is what orders compiler-synthesised symbols, which ranges cannot:
  // everything a macro generates shares one extent.  For
  // `PMU_FORMAT_ATTR(event, ...)`, libclang reports `event_show` and
  // `format_attr_event` as siblings with `__compiletime_assert_1121` inside
  // `event_show`'s body -- identical extents, different depths.
  //
  int32 nesting_level = 7;

  // DFS interval: the entry and exit numbers of a depth-first walk of this
  // object's containment tree.  A descendant is exactly an instance whose
  // dfs_enter lies strictly inside [dfs_enter, dfs_exit], which makes `unnest`
  // one btree range scan rather than a recursive walk, and direct children the
  // same query with `nesting_level = parent + 1` added.
  //
  // This is what orders compiler-synthesised symbols, which no source range
  // can: everything a macro generates shares one extent.  Siblings get
  // DISJOINT intervals even then -- for `PMU_FORMAT_ATTR(event, ...)`,
  // `event_show` [2,5] contains `__compiletime_assert_1121` [3,4] while
  // `format_attr_event` [6,7] does not.
  //
  // Number SPARSELY, in steps of 1024, so an ephemeral layer can insert an
  // instance between two neighbours without renumbering anything.  That allows
  // 10 successive inserts at one position (1024 -> 512 -> ... -> 1) before the
  // object needs a local renumber; containment never crosses objects, so the
  // blast radius is one file.
  int64 dfs_enter = 11;
  int64 dfs_exit = 12;

  // were folded / fold_depth.  Folding is the symbol's (Symbol.folded): it
  // says what is listed by default and has no place in the containment tree.
  reserved 13, 14;

  // Finer spans, each within [start_offset, end_offset).  All optional:
  // `name` is absent for synthesised symbols that have no identifier in the
  // source, `signature` for kinds that cannot be declared.
  Span name = 8;
  Span signature = 9;
  Span content = 10;
}

message SymbolRef {
  int64 to_symbol_local_id = 1; // References Symbol.local_id (unique within project)

  // The NAME span: the referencing token itself, where it is SPELLED.  For
  // `printk(foo)` the argument ref spans `foo` and the invocation ref spans
  // `printk`.  Spelling is what attributes each token to whoever typed it: a
  // token substituted from a macro ARGUMENT is spelled at the call site and so
  // belongs to the caller, while one written in the `#define` body is spelled
  // in the header and belongs to the macro.
  int32 from_offset_start = 2;
  int32 from_offset_end = 3;

  reserved 4, 5;  // were parent_local_id / an earlier nesting_level

  // The FULL span: the whole referencing construct, e.g. `printk(foo)` where
  // from_offset_* covers only `printk`.  Optional, display only.
  Span full = 6;

  // Depth of this reference, on the same scale as SymbolInstance.nesting_level:
  // an instance owns the refs at its own depth + 1.
  int32 nesting_level = 7;

  // Position in the same DFS sequence as the instances of this object.  A ref
  // is a point, not an interval: it is owned by the instance whose
  // [dfs_enter, dfs_exit] contains this number at depth - 1.
  int64 dfs_enter = 8;

  reserved 9, 10;  // were folded / fold_depth; see SymbolInstance

  // What the token does to its target: a SET of RefRole bits, zero meaning
  // nothing is stated.  Every bit is a positive fact about the text at this
  // token and an absent bit states nothing, so an index written before roles
  // existed, a name in a `#define` body, a type reference and a macro
  // invocation all read the same: "refers to".  Two sightings of one token
  // merge by union (`n++` is WRITE|TAKE).
  uint32 roles = 11;

  // Zero for a reference.  Otherwise this row is not something a token says
  // but a fact between two symbols, placed on the declaration of its source.
  RefRelation relation = 12;

  // Where a relation happened.  A relation row sits on the declaration of
  // its source (the field's declaration, the macro's `#define`), so its own
  // span says WHO is related, not where it was made so.  The witness names
  // one place in the code that made it so: the store `.read = bt_bmc_read`,
  // the invocation `DEFINE_MUTEX(lock)`, in Go the expression that hands a
  // value over where the interface is expected (`return &Job{}`).  It is the
  // first such place in file order (lowest object path, then lowest offset),
  // with how many there are.  Absent on a reference, whose own span is where
  // it happened, and on a relation with no place to name.
  Witness witness = 13;
}

// One place in the code, in an object of the same project.
message Witness {
  int64 object_local_id = 1;  // References Object.local_id
  int32 offset_start = 2;     // Byte offsets in that object, as SymbolRef.from_offset_*
  int32 offset_end = 3;
  uint32 sites = 4;           // How many places made this relation; this is the first.  At least 1.
}

// One bit per thing a referencing token can do to its target.  A role is
// what the TEXT does, not what runs: `fn = s->cb; fn()` calls through no
// callee token, and `*p = x` writes through no token of what it writes.
enum RefRole {
  REF_ROLE_UNSPECIFIED = 0;
  // The token is the callee of a call: `foo(x)`, `s->cb(x)`.
  REF_ROLE_CALL = 1;
  // The target is assigned or initialised: `s->cb = f`, `n++`, `.cb = f`.
  REF_ROLE_WRITE = 2;
  // Its value or address is taken, not called: `request_irq(n, handler)`,
  // `g = s->count`, `case REQ_OP_READ:`.
  REF_ROLE_TAKE = 4;
}

// A fact between two symbols that no token of the source spells.
enum RefRelation {
  REF_RELATION_NONE = 0;
  // The source's invocation declared the target: `DEFINE_MUTEX -> lock`.
  REF_RELATION_DECLARES = 1;
  // The source is a dispatch point and the target something stored in it:
  // `file_operations.read -> bt_bmc_read`, `(io.Reader).Read -> (*File).Read`.
  REF_RELATION_HOLDS = 2;
}

enum SymbolScope {
  SYMBOL_SCOPE_UNSPECIFIED = 0;
  LOCAL = 1;
  GLOBAL = 2;
}

enum SymbolType {
  SYMBOL_TYPE_UNSPECIFIED = 0;
  FUNCTION = 1;
  FILE = 2;
  MODULE = 3;
  DIRECTORY = 4;
  TYPE = 5;
  DATA = 6;
  MACRO = 7;
  FIELD = 8;
}

enum InstanceType {
  INSTANCE_TYPE_UNSPECIFIED = 0;
  DEFINITION = 1;
  DECLARATION = 2;
  // No producer emits EXPANSION any more: a macro USE is a SymbolRef naming
  // the macro, so a macro's only instance is its `#define`.  Kept so that an
  // index produced before that change still parses.
  EXPANSION = 3;
  SENTINEL = 4;
  CONTAINMENT = 5;
  SOURCE = 6;
  HEADER = 7;
  BUILD = 8;
  INST_FILE = 9;
  DOCUMENTATION = 10;
}
