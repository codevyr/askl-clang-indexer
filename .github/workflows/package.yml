name: Package

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build .deb package
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake make g++ git ca-certificates \
            libclang-19-dev \
            protobuf-compiler libprotobuf-dev libabsl-dev \
            dpkg-dev

      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if echo "$GITHUB_REF" | grep -q '^refs/tags/v'; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0~git$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          cmake -B build \
            -DLIBCLANG_PATH=/usr/lib/llvm-19/lib \
            -DLIBCLANG_INCLUDE_PATH=/usr/lib/llvm-19/include \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Create .deb package
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG="askl-clang-indexer_${VERSION}_amd64"

          # Assemble package tree
          mkdir -p "${PKG}/DEBIAN" "${PKG}/usr/local/bin"
          cp build/askl-clang-indexer "${PKG}/usr/local/bin/"
          strip "${PKG}/usr/local/bin/askl-clang-indexer"

          # Detect direct runtime deps from ELF NEEDED entries (not transitive deps)
          mkdir -p debian
          cp .github/packaging/dpkg-shlibdeps.control debian/control
          DEPS=$(dpkg-shlibdeps -O "${PKG}/usr/local/bin/askl-clang-indexer" 2>/dev/null \
            | grep '^shlibs:Depends=' \
            | sed 's/^shlibs:Depends=//')
          [ -n "$DEPS" ] || { echo "ERROR: dpkg-shlibdeps produced no output"; exit 1; }

          # Substitute version and deps into control template
          sed -e "s/@VERSION@/${VERSION}/" \
              -e "s/@DEPS@/${DEPS}/" \
              .github/packaging/control.in > "${PKG}/DEBIAN/control"

          dpkg-deb --build --root-owner-group "${PKG}"
          echo "deb=${PKG}.deb" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.deb }}
          path: ${{ steps.package.outputs.deb }}

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.deb }}
