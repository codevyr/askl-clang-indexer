name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: read
    steps:
      - name: Install deps
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            cmake make g++ git ca-certificates \
            libclang-19-dev \
            protobuf-compiler libprotobuf-dev libabsl-dev
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build
        run: |
          cmake -B build \
            -DLIBCLANG_PATH=/usr/lib/llvm-19/lib \
            -DLIBCLANG_INCLUDE_PATH=/usr/lib/llvm-19/include \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - test
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-linux:
    name: Build and push linux image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs:
      - build
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker/linux
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}:${{ needs.build.outputs.image_digest && format('sha-{0}', github.sha) || 'latest' }}
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=linux
          cache-to: type=gha,mode=max,scope=linux

  cleanup-untagged:
    name: Cleanup old untagged images
    runs-on: ubuntu-latest
    needs:
      - build
      - build-linux
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    permissions:
      packages: write
    steps:
      - name: Delete old base images
        uses: actions/delete-package-versions@v4
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
      - name: Delete old linux images
        uses: actions/delete-package-versions@v4
        continue-on-error: true
        with:
          package-name: ${{ github.event.repository.name }}-linux
          package-type: container
          min-versions-to-keep: 10
          delete-only-untagged-versions: true
